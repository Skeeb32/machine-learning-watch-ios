name: Moment
options:
  bundleIdPrefix: com.skeeb32
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MomentShared:
    path: MomentShared
targets:
  Moment:
    type: application
    platform: iOS
    sources: [Moment]
    dependencies:
      - package: MomentShared
      - target: MomentWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skeeb32.moment
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_CFBundleDisplayName: MOMENT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: MOMENT reads your daily steps to display your activity summary on your iPhone and paired Apple Watch. Your data stays on your devices.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: Moment/Moment.entitlements
      properties:
        com.apple.developer.healthkit: true
  MomentWatch:
    type: application
    platform: watchOS
    sources: [MomentWatch]
    dependencies:
      - package: MomentShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skeeb32.moment.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: MOMENT
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.skeeb32.moment
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
  MomentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MomentTests]
    dependencies:
      - target: Moment
      - package: MomentShared
  MomentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MomentUITests]
    dependencies:
      - target: Moment
schemes:
  Moment:
    build:
      targets:
        Moment: all
    test:
      targets: [MomentTests, MomentUITests]
  MomentWatch:
    build:
      targets:
        MomentWatch: all
